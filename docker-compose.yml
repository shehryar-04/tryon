version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: vton_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    image: tryon-vton:latest
    container_name: vton_api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - STORAGE_BACKEND=local
    volumes:
      - .:/app
      - ./storage_uploads:/app/storage_uploads
    depends_on:
      - redis
    restart: unless-stopped

  gpu_worker:
    image: tryon-vton:latest
    container_name: vton_gpu_worker
    command: celery -A worker.celery_app.celery_app worker --loglevel=info --concurrency=1
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - FORCE_CUDA=1
      - STORAGE_BACKEND=local
    volumes:
      - .:/app
      - ./storage_uploads:/app/storage_uploads
      - ./engine/weights:/app/engine/weights
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      - redis
      - api
    restart: unless-stopped
